<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Search</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #222;
}

header {
  background: #111;
  color: white;
  padding: 18px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 24px;
}

.search-box {
  display: flex;
  max-width: 700px;
  margin: 25px auto;
  padding: 0 15px;
}

.search-box input {
  flex: 1;
  padding: 14px;
  font-size: 16px;
  border: 1px solid #ccc;
  border-radius: 10px 0 0 10px;
  outline: none;
}

.search-box button {
  padding: 14px 20px;
  border: none;
  background: #111;
  color: white;
  border-radius: 0 10px 10px 0;
  cursor: pointer;
}

.results {
  max-width: 700px;
  margin: auto;
  padding: 0 15px 30px;
}

.result {
  background: white;
  padding: 18px;
  margin-bottom: 12px;
  border-radius: 12px;
  box-shadow: 0 2px 8px #0001;
  cursor: pointer;
}

.result:hover {
  background: #fafafa;
}

.result h2 {
  margin: 0 0 6px;
  color: #1769aa;
  font-size: 19px;
}

.result p {
  margin: 5px 0;
}

.url {
  color: #16833a;
  font-size: 14px;
}

.browser {
  display: none;
  position: fixed;
  inset: 0;
  background: white;
  z-index: 10;
}

.browser-bar {
  display: flex;
  gap: 8px;
  padding: 10px;
  background: #111;
}

.browser-bar button {
  border: none;
  padding: 9px 13px;
  border-radius: 7px;
  cursor: pointer;
}

.browser iframe {
  width: 100%;
  height: calc(100% - 58px);
  border: none;
}
</style>
</head>

<body>

<header>
  <h1>🌐 Web Search</h1>
</header>

<div class="search-box">
  <input id="search" placeholder="検索したいものを入力...">
  <button onclick="search()">検索</button>
</div>

<div id="results" class="results"></div>

<div id="browser" class="browser">

  <div class="browser-bar">
    <button onclick="closeBrowser()">← 戻る</button>
    <button onclick="reloadBrowser()">🔄 更新</button>
  </div>

  <iframe id="page"></iframe>

</div>

<script>

function search() {

  const q = document.getElementById("search").value.trim();

  if (!q) return;

  const results = document.getElementById("results");

  results.innerHTML = `
    <div class="result" onclick="openPage('https://www.google.com/search?q=${encodeURIComponent(q)}')">
      <h2>🔎 ${escapeHTML(q)} - Google検索</h2>
      <p>Googleで「${escapeHTML(q)}」を検索</p>
      <div class="url">google.com</div>
    </div>

    <div class="result" onclick="openPage('https://www.youtube.com/results?search_query=${encodeURIComponent(q)}')">
      <h2>📺 ${escapeHTML(q)} - YouTube</h2>
      <p>YouTubeで検索</p>
      <div class="url">youtube.com</div>
    </div>

    <div class="result" onclick="openPage('https://ja.wikipedia.org/wiki/${encodeURIComponent(q)}')">
      <h2>📖 ${escapeHTML(q)} - Wikipedia</h2>
      <p>Wikipediaで検索</p>
      <div class="url">ja.wikipedia.org</div>
    </div>
  `;
}

function openPage(url) {

  document.getElementById("browser").style.display = "block";

  document.getElementById("page").src = url;
}

function closeBrowser() {

  document.getElementById("browser").style.display = "none";

  document.getElementById("page").src = "";
}

function reloadBrowser() {

  const frame = document.getElementById("page");

  frame.src = frame.src;
}

function escapeHTML(text) {

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}

</script>

</body>
</html>
